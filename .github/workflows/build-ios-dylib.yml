name: Build iOS Dylib

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'InjectedTTS.mm'
      - '.github/workflows/build-ios-dylib.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build InjectedTTS.dylib
        run: |
          clang -x objective-c++ -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=12.0 \
            -dynamiclib \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework AVFoundation \
            -framework WebKit \
            -framework CoreGraphics \
            -lz \
            -lc++ \
            -o InjectedTTS.dylib \
            InjectedTTS.mm

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InjectedTTS-Dylib
          path: InjectedTTS.dylib
