name: Build GoogleDocsTTS Dylib

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'GoogleDocsTTS/**'
      - '.github/workflows/build-ios-dylib.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          "$HOME/theos/bin/update-theos" || git -C "$HOME/theos" submodule update --init --recursive
          ls "$HOME/theos/vendor/include" >/dev/null 2>&1
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDKs
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$HOME/theos/sdks"
          cp -R /tmp/sdks/iPhoneOS*.sdk "$HOME/theos/sdks/" || true
          ls "$HOME/theos/sdks"

      - name: Install ldid
        run: brew install ldid || true

      - name: Build GoogleDocsTTS.dylib
        working-directory: GoogleDocsTTS
        run: make FINALPACKAGE=1

      - name: List build output
        run: |
          ls -la GoogleDocsTTS/.theos/obj/
          file GoogleDocsTTS/.theos/obj/GoogleDocsTTS.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleDocsTTS-Dylib
          path: GoogleDocsTTS/.theos/obj/GoogleDocsTTS.dylib
