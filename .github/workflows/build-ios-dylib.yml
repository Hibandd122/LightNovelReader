name: Build GoogleDocsTTS Dylib

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'GoogleDocsTTS/**'
      - '.github/workflows/build-ios-dylib.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDKs
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$HOME/theos/sdks"
          cp -R /tmp/sdks/iPhoneOS*.sdk "$HOME/theos/sdks/" || true
          ls "$HOME/theos/sdks"

      - name: Build GoogleDocsTTS.dylib
        working-directory: GoogleDocsTTS
        run: make FINALPACKAGE=1

      - name: List build output
        run: |
          ls -la GoogleDocsTTS/.theos/obj/Release/ || true
          find GoogleDocsTTS/.theos -name "*.dylib" -print

      - name: Combine architectures
        run: |
          DYLIB_DIR="GoogleDocsTTS/.theos/obj/Release"
          lipo -create \
            "$DYLIB_DIR/arm64/GoogleDocsTTS.dylib" \
            "$DYLIB_DIR/arm64e/GoogleDocsTTS.dylib" \
            -output GoogleDocsTTS.dylib
          file GoogleDocsTTS.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleDocsTTS-Dylib
          path: GoogleDocsTTS.dylib
