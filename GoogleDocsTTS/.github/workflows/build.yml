name: Build GoogleDocsTTS

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoogleDocsTTS/**'

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Install rootless SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$HOME/theos/sdks"
          cp -R /tmp/sdks/*.sdk "$HOME/theos/sdks/" || true
      - name: Package tweak
        working-directory: GoogleDocsTTS
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: GoogleDocsTTS-rootless
          path: GoogleDocsTTS/packages/*.deb
