name: LightNovelReader
options:
  bundleIdPrefix: com.lightnovelreader
  objectVersion: 54
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
targets:
  LightNovelReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LightNovelReader/App
      - path: LightNovelReader/Data
      - path: LightNovelReader/Domain
      - path: LightNovelReader/Infrastructure
      - path: LightNovelReader/Presentation
    dependencies:
      - package: GoogleSignIn
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: LightNovelReader/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
  LightNovelReaderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LightNovelReader/Tests
    dependencies:
      - target: LightNovelReader
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  LightNovelReader:
    build:
      targets:
        LightNovelReader: all
        LightNovelReaderTests: [test]
    test:
      targets:
        - name: LightNovelReaderTests