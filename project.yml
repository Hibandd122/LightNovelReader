name: LightNovelReader
options:
  bundleIdPrefix: com.lightnovelreader
  objectVersion: 54
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
targets:
  LightNovelReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LightNovelReader
        excludes:
          - "Tests"
          - "LightNovelWidgets"
    dependencies:
      - package: GoogleSignIn
    info:
      path: LightNovelReader/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
