name: LightNovelReader
options:
  bundleIdPrefix: com.lightnovelreader
  objectVersion: 54
targets:
  LightNovelReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LightNovelReader
        excludes:
          - "Tests"
          - "LightNovelWidgets"
    info:
      path: LightNovelReader/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
